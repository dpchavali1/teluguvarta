name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tokens:generate
      - run: pnpm run tokens:contrast
      - name: Fail if generated design tokens are stale
        run: git diff --exit-code -- apps/web/src/app/tokens.css apps/admin/src/app/tokens.css apps/mobile/src/theme/tokens.ts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm --filter @teluguvarta/mobile run test
      - run: pnpm --filter @teluguvarta/web run test
      # Production builds (review #17). No API is reachable here, so this
      # also checks that the builds fall back instead of failing.
      - run: pnpm --filter @teluguvarta/web run build
      - run: pnpm --filter @teluguvarta/admin run build
      - name: Dependency scan (T19 §16 baseline)
        # Real gate as of the T20 Next.js 15 upgrade (was informational
        # while next@14.2.35 had no 14.x fix for its unauthenticated RCEs).
        run: pnpm audit --audit-level=high

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teluguvarta
          POSTGRES_PASSWORD: teluguvarta
          POSTGRES_DB: teluguvarta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teluguvarta -d teluguvarta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://teluguvarta:teluguvarta@localhost:5432/teluguvarta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches infra/deploy/api.Dockerfile
      - uses: astral-sh/setup-uv@v6
      - name: Fail if requirements.lock is stale
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.12 --generate-hashes -o requirements.lock -q
          git diff --exit-code -- requirements.lock || {
            echo "apps/api/requirements.lock is stale; rerun the command in its header and commit it." >&2
            exit 1
          }
      # Runtime deps from the same hashed lock the image uses; dev tools on top.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: mypy may not add errors (baseline in mypy-baseline.txt)
        run: |
          n=$(mypy app | grep -c ': error:' || true)
          base=$(cat mypy-baseline.txt)
          echo "mypy errors: $n (baseline $base)"
          if [ "$n" -gt "$base" ]; then
            echo "New mypy errors; fix them (see 'mypy app')." >&2
            exit 1
          elif [ "$n" -lt "$base" ]; then
            echo "::notice::mypy errors dropped to $n; lower mypy-baseline.txt."
          fi
      - name: No provider SDK outside app/ai/providers (ADR-001)
        run: |
          if grep -rEn "^\s*(import|from)\s+(openai|anthropic)\b" app --include="*.py" \
              | grep -v "app/ai/providers/openai_provider.py\|app/ai/providers/anthropic_provider.py"; then
            echo "A provider SDK is imported outside app/ai/providers — see ADR-001." >&2
            exit 1
          fi
      - name: Dependency scan (T19 §16 baseline)
        run: pip-audit --skip-editable
      - name: SAST (T19 §16 baseline)
        run: bandit -r app -c pyproject.toml
      # tests/test_golden_eval.py (T19 §18) runs the golden AI regression
      # set as part of this same `pytest` invocation — no separate step.
      - run: pytest

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: python3 -m venv apps/api/.venv
      - run: apps/api/.venv/bin/pip install -e "./apps/api[dev]"
      - run: bash infra/scripts/generate_contracts.sh
      - name: Fail if generated contracts are stale
        run: |
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/types.gen.ts || {
            echo "packages/contracts is stale — run 'pnpm run contracts:generate' and commit the result." >&2
            exit 1
          }
      - run: pnpm --filter @teluguvarta/contracts run typecheck

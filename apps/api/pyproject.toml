[project]
name = "teluguvarta-api"
version = "0.0.1"
description = "TTE — The Telugu Edit API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "pyotp>=2.9.0",
    "defusedxml>=0.7.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "openapi-spec-validator>=0.7.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# T19 SAST (§16 baseline). B101 (assert) fires on internal
# already-true-by-construction invariants (see app/adapters/base.py,
# app/adapters/rss.py, app/jobs/source_fetch.py) — not disabled prod code
# paths, since none of this API is ever run with `python -O`. B311
# (stdlib `random`) fires on app/jobs/translate.py's QA-sample rate, which
# has no security/cryptographic role — it just decides which fraction of
# translations get an extra human read. Both are real bandit rules kept
# active project-wide; only these two checks are skipped, everything else
# (including the XML/XXE class B314 caught and fixed this same ticket) stays
# on.
skips = ["B101", "B311"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Header() in argument defaults is the
# documented, idiomatic pattern — not the mutable-default footgun B008
# guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

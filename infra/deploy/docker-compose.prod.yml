# Production stack for a single VPS: Postgres, API, worker, admin and the public web app.
# TLS/routing by the host's nginx, see nginx-setup.sh. Driven by infra/deploy/deploy.sh:
#   docker compose -f infra/deploy/docker-compose.prod.yml --env-file .env.prod up -d
name: teluguvarta
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teluguvarta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: teluguvarta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teluguvarta -d teluguvarta"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: ../.., dockerfile: infra/deploy/api.Dockerfile }
    restart: unless-stopped
    env_file: ../../.env.prod
    ports: ["127.0.0.1:18000:8000"]
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    build: { context: ../.., dockerfile: infra/deploy/api.Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.worker"]
    env_file: ../../.env.prod
    depends_on: { postgres: { condition: service_healthy } }

  admin:
    ports: ["127.0.0.1:13001:3001"]
    build:
      context: ../..
      dockerfile: infra/deploy/next.Dockerfile
      args:
        APP: admin
        PORT: "3001"
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped

  # Public site at https://${DOMAIN} (www redirects there, see nginx-setup.sh).
  web:
    ports: ["127.0.0.1:13000:3000"]
    build:
      context: ../..
      dockerfile: infra/deploy/next.Dockerfile
      args:
        APP: web
        PORT: "3000"
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped


volumes:
  pgdata:
